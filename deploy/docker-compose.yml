services:
  postgres:
    image: postgres:13
    restart: unless-stopped
    environment:
      POSTGRES_DB: nestserver
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/01-uuid.sql:ro
    networks:
      - backend

  minio:
    image: chrislusf/seaweedfs:3.80
    restart: unless-stopped
    command: server -dir=/data -filer -s3 -s3.port=9000 -s3.config=/etc/seaweed/s3.json
    volumes:
      - weeddata:/data
      - ./s3.json:/etc/seaweed/s3.json:ro
    networks:
      - backend

  api:
    build:
      context: ../server
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: nestserver
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_PROTOCOL: http://
      DEMO_LOGIN_ENABLED: "false"
    depends_on:
      - postgres
      - minio
    networks:
      - backend

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8083:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/build:/usr/share/nginx/html:ro
    depends_on:
      - api
      - minio
    networks:
      - backend

networks:
  backend:

volumes:
  pgdata:
  weeddata:
